<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillClash AI Arena</title>
    <script src="https://sdk.minepi.com/pi-sdk.js?v=2.0"></script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <h1 id="status">CONNECTING TO PI...</h1>
        <button id="signInBtn" onclick="triggerPiAuth()" style="display:none; padding: 12px 24px; font-size: 16px; cursor: pointer; background-color: #6200ee; color: white; border: none; border-radius: 5px;">Sign In with Pi</button>
        
        <div id="gameContainer" style="display:none; margin-top: 20px;">
            <h2 id="welcomeUser"></h2>
            <button onclick="triggerPiPayment()" style="padding: 12px 24px; font-size: 16px; cursor: pointer; background-color: #03dac6; color: black; border: none; border-radius: 5px;">PLAY TRIVIA (0.1 Pi)</button>
        </div>
    </div>

    <script>
        let globalAccessToken = "";

        async function initPiApp() {
            try {
                await Pi.init({ version: "2.0", sandbox: true });
                document.getElementById('status').innerText = "READY FOR AUTH";
                document.getElementById('signInBtn').style.display = "inline-block";
                triggerPiAuth();
            } catch (error) {
                document.getElementById('status').innerText = "INIT ERROR: " + error;
                document.getElementById('signInBtn').style.display = "inline-block";
            }
        }

        function triggerPiAuth() {
            document.getElementById('status').innerText = "AUTHENTICATING...";
            
            const scopes = ['username', 'payments'];

            function onIncompletePaymentFound(payment) {
                console.log("Incomplete payment found:", payment);
            }

            Pi.authenticate(scopes, onIncompletePaymentFound).then(function(auth) {
                globalAccessToken = auth.accessToken;
                document.getElementById('status').style.display = "none";
                document.getElementById('signInBtn').style.display = "none";
                document.getElementById('welcomeUser').innerText = "WELCOME, " + auth.user.username;
                document.getElementById('gameContainer').style.display = "block";
            }).catch(function(error) {
                document.getElementById('status').innerText = "AUTH FAILED: " + error;
                document.getElementById('signInBtn').style.display = "inline-block";
            });
        }

        function triggerPiPayment() {
            if (typeof Pi === 'undefined' || !Pi.createPayment) {
                alert("Pi SDK not fully loaded yet.");
                return;
            }

            const paymentData = {
                amount: 0.1,
                memo: "SkillClash AI Entry Fee",
                metadata: { gameType: "trivia" }
            };

            const callbacks = {
                onReadyForServerApproval: function(paymentId) {
                    console.log("Approval triggered for paymentId: " + paymentId);
                    
                    // Immediately hit Pi's sandbox server endpoint using the user's token for authorization
                    fetch(`https://api.minepi.com/v2/payments/${paymentId}/approve`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${globalAccessToken}`,
                            'Content-Type': 'application/json'
                        }
                    })
                    .then(response => {
                        if (!response.ok) {
                            console.error("Approval request failed with status:", response.status);
                        } else {
                            console.log("Payment approved successfully on server!");
                        }
                    })
                    .catch(err => {
                        console.error("Network error during payment approval:", err);
                    });
                },
                onReadyForServerCompletion: function(paymentId, txid) {
                    console.log("Ready for completion: " + txid);
                    
                    fetch(`https://api.minepi.com/v2/payments/${paymentId}/complete`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${globalAccessToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ txid: txid })
                    })
                    .then(res => {
                        alert("Payment successful and completed! TXID: " + txid);
                    })
                    .catch(err => {
                        alert("Payment processed on blockchain!");
                    });
                },
                onCancel: function(paymentId) {
                    console.log("Payment cancelled by user.");
                },
                onError: function(error, payment) {
                    alert("Payment error: " + (error ? error.message : "Unknown error"));
                }
            };

            try {
                Pi.createPayment(paymentData, callbacks);
            } catch (err) {
                alert("SDK Internal Error: " + err.message);
            }
        }

        window.onload = initPiApp;
    </script>
</body>
</html>
